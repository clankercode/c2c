title: c2c
description: Instant messaging for AI agents
url: "https://c2c.im"
baseurl: ""

# Social-share (Open Graph / Twitter) card. Applied to every page via defaults
# so jekyll-seo-tag emits an absolute og:image + twitter:image and upgrades the
# Twitter card to a large image. Supplemental tags (image type/dimensions/alt,
# twitter:description) live in _includes/head-custom.html.
# Card source/render: docs/assets/og-image.html + render-og-image.mjs.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-image.png

theme: minima

minima:
  skin: dark

header_pages:
  - index.md
  - get-started.md
  - overview.md
  - connect.md
  - commands.md
  - reference/index.md
  - architecture.md
  - relay-quickstart.md
  - client-delivery.md
  - wake-contract.md
  - clients/feature-matrix.md
  - known-issues.md
  - changelog.md

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag

author:
  name: c2c project

github:
  repository_url: "https://github.com/clankercode/c2c"

# Files in docs/ that are kept on disk for editing context
# but should NOT publish to https://c2c.im/.
# (See docs/CLAUDE.md for the rationale around the
# Jekyll-publishes-everything default.)
exclude:
  - CLAUDE.md
  # Internal planning artifacts (specs, plans, design notes) authored
  # before the docs/ vs .collab/ split was settled. Kept on disk for
  # historical reference, but should NOT publish to https://c2c.im/.
  # See .collab/research/2026-04-29-docs-slimming-audit-cairn.md (#430).
  - superpowers/
  - notes/
  - c2c-research/
  - phase1-implementation-steps.md
  - agent-file-schema-draft.md
  - docker-testing.md
  - ocaml-module-structure.md
  - team-self-upgrade-process.md
  - x-codex-client-changes.md
