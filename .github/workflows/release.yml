name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, with or without leading v'
        required: true
        type: string
      draft:
        description: 'Create the GitHub release as a draft'
        required: false
        default: true
        type: boolean
      publish_npm:
        description: 'Publish npm packages after dry-run checks'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci-gate:
    uses: ./.github/workflows/ci.yml
    # The reusable CI workflow declares a master-only regen-and-commit job
    # with contents:write. GitHub validates the caller's permission ceiling
    # before evaluating that job's tag-ref condition, so read-only here causes
    # the entire release workflow to fail at startup with zero jobs.
    # On release tags the write-capable job remains conditionally disabled.
    permissions:
      contents: write

  validate:
    needs: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Validate version and changelog
        run: python3 tools/ci/release.py validate --version '${{ steps.meta.outputs.version }}'

      - name: Verify generated files are committed
        shell: bash
        run: |
          set -euo pipefail
          just codegen-role-designer
          just codegen-role-templates
          just codegen-opencode-plugin
          just codegen-hermes-plugin
          just sync-skills
          just codegen-claude-skill
          just sync-skills-check
          git diff --exit-code -- .c2c .collab/skills .opencode/skills .codex/skills ocaml data

      - name: Build command/docs drift report
        shell: bash
        run: python3 scripts/c2c-docs-drift.py --doc CLAUDE.md --summary --warn-only

      - name: Write release notes
        run: python3 tools/ci/release.py notes --version '${{ steps.meta.outputs.version }}' --out dist/release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: dist/release-notes.md

  build:
    needs: [ci-gate, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          # B190: build Linux release artifacts on Ubuntu 22.04 (glibc 2.35)
          # so official binaries run on Ubuntu 22.04+ / RHEL 9+ / Debian 12+.
          # Building on ubuntu-latest (currently 24.04+) embeds GLIBC_2.38+
          # symbols and breaks 22.04. Ubuntu 20.04 (glibc 2.31) still needs a
          # local build or a future manylinux/static artifact.
          - target: linux-x64
            os: ubuntu-22.04
            max_glibc: '2.35'
            smoke_image: ubuntu:22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
            max_glibc: '2.35'
            smoke_image: arm64v8/ubuntu:22.04
          - target: darwin-x64
            os: macos-15-intel
          - target: darwin-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
          dune-cache: true

      - name: Restore OCaml dependency cache
        uses: actions/cache@v4
        with:
          path: |
            _opam
            ~/.opam/download-cache
          # Key by the concrete runner image (matrix.os), NOT runner.os: the
          # generic Linux/X64 key collides with ci.yml's ubuntu-latest cache,
          # and a 24.04-built _opam (dune linked against GLIBC_2.38) restored
          # on this 22.04 builder fails with "GLIBC_2.38 not found" (v0.13.0
          # release, run 29630787011).
          key: ocaml-deps-${{ matrix.os }}-${{ runner.arch }}-5.3.0-${{ hashFiles('justfile', 'dune-project', 'ocaml/**/dune') }}
          restore-keys: |
            ocaml-deps-${{ matrix.os }}-${{ runner.arch }}-5.3.0-

      - name: Install OCaml dependencies
        run: just install-deps

      - name: Build c2c binary
        shell: bash
        env:
          C2C_BUILD_GIT_SHA: ${{ github.sha }}
          C2C_BUILD_DATE: ${{ needs.validate.outputs.date }}
        run: |
          set -euo pipefail
          opam exec -- dune build --release \
            ./ocaml/cli/c2c.exe \
            ./ocaml/cli/c2c_deliver_inbox.exe \
            ./ocaml/server/c2c_mcp_server.exe \
            ./ocaml/server/c2c_mcp_server_inner_bin.exe \
            ./ocaml/tools/c2c_inbox_hook.exe \
            ./ocaml/tools/c2c_cold_boot_hook.exe \
            ./ocaml/tools/c2c_post_compact_hook_bin.exe
          mkdir -p "dist/c2c-${{ matrix.target }}"
          c2c_name=c2c
          deliver_name=c2c-deliver-inbox
          server_name=c2c-mcp-server
          inner_name=c2c-mcp-inner
          hook_name=c2c-inbox-hook-ocaml
          cold_boot_name=c2c-cold-boot-hook
          post_compact_name=c2c-post-compact-hook
          cp _build/default/ocaml/cli/c2c.exe "dist/c2c-${{ matrix.target }}/${c2c_name}"
          cp _build/default/ocaml/cli/c2c_deliver_inbox.exe "dist/c2c-${{ matrix.target }}/${deliver_name}"
          cp _build/default/ocaml/server/c2c_mcp_server.exe "dist/c2c-${{ matrix.target }}/${server_name}"
          cp _build/default/ocaml/server/c2c_mcp_server_inner_bin.exe "dist/c2c-${{ matrix.target }}/${inner_name}"
          cp _build/default/ocaml/tools/c2c_inbox_hook.exe "dist/c2c-${{ matrix.target }}/${hook_name}"
          cp _build/default/ocaml/tools/c2c_cold_boot_hook.exe "dist/c2c-${{ matrix.target }}/${cold_boot_name}"
          cp _build/default/ocaml/tools/c2c_post_compact_hook_bin.exe "dist/c2c-${{ matrix.target }}/${post_compact_name}"
          chmod +x "dist/c2c-${{ matrix.target }}/${c2c_name}"
          chmod +x "dist/c2c-${{ matrix.target }}/${deliver_name}"
          chmod +x "dist/c2c-${{ matrix.target }}/${server_name}"
          chmod +x "dist/c2c-${{ matrix.target }}/${inner_name}"
          chmod +x "dist/c2c-${{ matrix.target }}/${hook_name}"
          chmod +x "dist/c2c-${{ matrix.target }}/${cold_boot_name}"
          chmod +x "dist/c2c-${{ matrix.target }}/${post_compact_name}"
          "dist/c2c-${{ matrix.target }}/${c2c_name}" --version

          # B190: refuse to ship Linux binaries that need GLIBC newer than the
          # documented floor (Ubuntu 22.04 / glibc 2.35).
          if [ -n "${{ matrix.max_glibc || '' }}" ]; then
            chmod +x scripts/check-glibc-max.sh
            scripts/check-glibc-max.sh "${{ matrix.max_glibc }}" \
              "dist/c2c-${{ matrix.target }}/${c2c_name}" \
              "dist/c2c-${{ matrix.target }}/${deliver_name}" \
              "dist/c2c-${{ matrix.target }}/${server_name}" \
              "dist/c2c-${{ matrix.target }}/${inner_name}" \
              "dist/c2c-${{ matrix.target }}/${hook_name}" \
              "dist/c2c-${{ matrix.target }}/${cold_boot_name}" \
              "dist/c2c-${{ matrix.target }}/${post_compact_name}"
          fi

          tar -czf "dist/c2c-${{ matrix.target }}/c2c-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz" \
            -C "dist/c2c-${{ matrix.target }}" \
            "${c2c_name}" "${deliver_name}" "${server_name}" "${inner_name}" "${hook_name}" \
            "${cold_boot_name}" "${post_compact_name}"

      # Optional runtime smoke: prove the binary starts on the floor distro
      # with only the documented shared-library deps (B190).
      - name: Docker smoke on minimum glibc distro
        if: ${{ matrix.smoke_image != '' }}
        shell: bash
        run: |
          set -euo pipefail
          image='${{ matrix.smoke_image }}'
          bin="dist/c2c-${{ matrix.target }}/c2c"
          docker run --rm \
            -v "${{ github.workspace }}/${bin}:/c2c:ro" \
            "$image" \
            bash -lc 'set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq libsqlite3-0 libgmp10 >/dev/null
              /c2c --version'

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2c-${{ matrix.target }}
          path: dist/c2c-${{ matrix.target }}/

  package:
    needs: [ci-gate, validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: c2c-*
          path: dist/artifacts

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: dist

      - name: Stage binary release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          find dist/artifacts -name '*.tar.gz' -type f -exec cp {} dist/release/ \;

      - name: Stage npm packages
        run: |
          python3 tools/ci/release.py package-npm \
            --version '${{ needs.validate.outputs.version }}' \
            --artifacts-dir dist/artifacts \
            --dist-dir dist/npm
          python3 tools/ci/release.py npm-publish-order --dist-dir dist/npm --out dist/npm-publish-order.txt
          tar -czf "dist/release/c2c-${{ needs.validate.outputs.version }}-npm-packages.tar.gz" -C dist npm

      - name: Write checksums and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/release.py checksums --input-dir dist/release --out dist/release/SHA256SUMS
          python3 tools/ci/release.py manifest \
            --version '${{ needs.validate.outputs.version }}' \
            --artifacts-dir dist/release \
            --out dist/release/release-manifest.json

      - name: Set up Node for npm packaging
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Ensure trusted-publishing-capable npm
        shell: bash
        run: |
          set -euo pipefail
          current="$(npm --version)"
          if node - "$current" <<'NODE'
          const current = process.argv[2].split('.').map(Number);
          const minimum = [11, 5, 1];
          for (let i = 0; i < minimum.length; i += 1) {
            if ((current[i] || 0) > minimum[i]) process.exit(0);
            if ((current[i] || 0) < minimum[i]) process.exit(1);
          }
          process.exit(0);
          NODE
          then
            echo "npm ${current} is trusted-publishing capable"
          else
            echo "npm ${current} is too old for trusted publishing; upgrading"
            npm install -g npm@latest
          fi

      - name: Remove token auth for npm trusted publishing
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm) }}
        shell: bash
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i.bak '/_authToken/d' "$npmrc"
          fi

      - name: npm pack dry-run
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r package_dir; do
            npm pack --dry-run "$package_dir"
          done < dist/npm-publish-order.txt

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.validate.outputs.tag }}'
          draft_flag=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.draft }}" = "true" ]; then
            draft_flag=(--draft)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            gh release create "$tag" dist/release/* \
              --target "$GITHUB_SHA" \
              --title "c2c ${{ needs.validate.outputs.version }}" \
              --notes-file dist/release-notes.md \
              "${draft_flag[@]}"
          fi

      - name: Publish npm packages
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm) }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r package_dir; do
            npm publish "$package_dir" --access public --provenance
          done < dist/npm-publish-order.txt
