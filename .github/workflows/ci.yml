name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Python test dependencies
        run: python3 -m pip install pytest

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
          dune-cache: true

      - name: Restore OCaml dependency cache
        uses: actions/cache@v4
        with:
          path: |
            _opam
            ~/.opam/download-cache
          key: ocaml-deps-${{ runner.os }}-${{ runner.arch }}-5.3.0-${{ hashFiles('justfile', 'dune-project', 'ocaml/**/dune') }}
          restore-keys: |
            ocaml-deps-${{ runner.os }}-${{ runner.arch }}-5.3.0-

      - name: Install OCaml dependencies
        run: just install-deps

      - name: Build
        run: just build

      - name: Python release-tool tests
        run: python3 -m pytest tests/test_release_tool.py -q --force-test-env

      - name: OCaml tests
        run: just test-ocaml
