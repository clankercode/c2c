name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install runtime tools (inotify-tools)
        # `c2c monitor` and deliver-watch shell out to inotifywait; the hosted
        # runner image does not include it. Without this the monitor exits at
        # watch setup and inotify-dependent tests fail (B246).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends inotify-tools

      - name: Restore Python pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('tests/test_release_tool.py') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install Python test dependencies
        run: python3 -m pip install pytest

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
          dune-cache: true

      - name: Restore OCaml dependency cache
        uses: actions/cache@v4
        with:
          path: |
            _opam
            ~/.opam/download-cache
          key: ocaml-deps-${{ runner.os }}-${{ runner.arch }}-5.3.0-${{ hashFiles('justfile', 'dune-project', 'ocaml/**/dune') }}
          restore-keys: |
            ocaml-deps-${{ runner.os }}-${{ runner.arch }}-5.3.0-

      - name: Install OCaml dependencies
        run: just install-deps

      - name: Skill/generated drift gates
        shell: bash
        run: |
          set -euo pipefail
          just sync-skills
          just codegen-claude-skill
          just sync-skills-check
          git diff --exit-code -- .collab/skills .opencode/skills .codex/skills ocaml/cli/c2c_claude_skill_embedded.ml

      - name: Build
        run: just build

      - name: Python release-tool tests
        run: python3 -m pytest tests/test_release_tool.py -q --force-test-env

      - name: OCaml tests
        env:
          DUNE_WATCHDOG_TIMEOUT: '180'
        run: just test-ocaml
